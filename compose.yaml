services:
  tidecloak:
    image: tideorg/tidecloak-dev:latest
    container_name: research-share-tidecloak
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set in .env}
    volumes:
      - ./data/h2:/opt/keycloak/data/h2
    restart: unless-stopped
